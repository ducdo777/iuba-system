<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Nhập Liệu IUBA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="login-page" class="login-container">
        <div class="login-box">
            <div class="login-header">
                <i class="fas fa-users fa-3x"></i>
                <h1>Hệ Thống IUBA</h1>
                <p>Đăng nhập để nhập liệu</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Tên đăng nhập</label>
                    <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Đăng nhập
                </button>
                <div id="login-error" class="error-message"></div>
            </form>
        </div>
    </div>

    <div id="app" class="app-container hidden">
        <header class="app-header">
            <div class="header-left">
                <i class="fas fa-users"></i>
                <h1>Hệ Thống IUBA - Team <span id="team-name"></span></h1>
            </div>
            <div class="header-right">
                <span id="user-name"></span>
                <button id="logout-btn" class="btn btn-secondary">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </button>
            </div>
        </header>

        <div class="app-body">
            <main class="main-content">
                <section class="content-section active">
                    <div class="section-header">
                        <h2><i class="fas fa-edit"></i> Nhập dữ liệu hoạt động</h2>
                        <button class="btn btn-primary" onclick="openDataModal()">
                            <i class="fas fa-plus"></i> Thêm dữ liệu
                        </button>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Ngày</th>
                                    <th>Đơn thuần</th>
                                    <th>Hữu hiệu</th>
                                    <th>Baptem</th>
                                    <th>Thờ phượng</th>
                                    <th>Laxaro</th>
                                    <th>Ghi chú</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="data-tbody"></tbody>
                        </table>
                    </div>

                    <div class="stats-summary" style="margin-top: 2rem;">
                        <h3>Thống kê của Team</h3>
                        <div id="team-stats"></div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay"></div>
    <script src="user.js"></script>
</body>
</html>
